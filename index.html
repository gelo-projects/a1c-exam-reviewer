      cursor: pointer;
      outline-style: solid;

    }
    .option-btn {

    }

    }
    .action-btn {

      color: white;

    }
    img.responsive-img {

      height: auto;
      max-height: 320px;

    .footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background-color: dimgray;
      color: white;
      text-align: center;
    }

    let state = {

    function renderMenu() {
      const html = `
        <h2>Select a Category</h2>
        <div class="categories">
          ${categories.map(cat => `
            <button class="category-btn" onclick='startCategory(${JSON.stringify(cat)})'>${cat.name.toUpperCase()}</button>
          `).join('')}
        </div>
      `;
      document.getElementById('app').innerHTML = html;
    }

    function startCategory(cat) {
      const questions = cat.name === "Republic Acts" ? republicActsQuestions :
                        cat.name === "Special Laws" ? specialLawsQuestions :
                        cat.name === "Basic Driving" ? situationalQuestions :
                        cat.name === "Pavement Markings" ? pavementMarkings :
                        cat.name === "Road Signs" ? roadMarkings :
                        Array.from({ length: cat.count }, () => sampleQuestion);

      state = {
        ...state,
        step: 'quiz',
        score: 0,
        index: 0,
        selected: null,
        answered: false,
        currentCategory: cat,
        questions,
      };
      renderQuiz();
    }

    function handleAnswer(i) {
      if (state.answered) return;
      state.selected = i;
      state.answered = true;
      if (i === state.questions[state.index].correct) {
        state.score++;
      }
      renderQuiz();
    }

    function nextQuestion() {
      if (state.index + 1 < state.questions.length) {
        state.index++;
        state.selected = null;
        state.answered = false;
        renderQuiz();
      } else {
        renderResult();
      }
    }

    function renderQuiz() {
      const q = state.questions[state.index];
      const html = `
        <h2>Question ${state.index + 1} / ${state.questions.length}</h2>
        <p>${q.question}</p>
        ${state.currentCategory.hasImages && q.image ? `<img src="${q.image}" class="responsive-img" alt="Question visual" />` : ''}
        ${q.options.map((opt, i) => `
          <button class="option-btn ${state.answered ? (i === q.correct ? 'correct' : i === state.selected ? 'incorrect' : '') : ''}" onclick='handleAnswer(${i})' ${state.answered ? 'disabled' : ''}>
            ${opt}
          </button>
        `).join('')}
        ${state.answered ? `<button class="action-btn" onclick="nextQuestion()">Next</button>` : ''}
      `;
      document.getElementById('app').innerHTML = html;
    }

    function renderResult() {

        <h3>${state.score} / ${state.questions.length}</h3>
        <p>${state.score >= state.questions.length / 2 ? "We knew you could do it. Congrats!" : "Try again, you got this!"}</p>
        <button class="action-btn" onclick="renderMenu()">Back to Category</button>
        <button class="action-btn" onclick="startCategory(state.currentCategory)">Retake Exam</button>
      `;
      document.getElementById('app').innerHTML = html;
    }

    renderMenu();
  </script>
  <div class="footer">
  <p>Created by Gelo Aves</p>
</div>
</body>
